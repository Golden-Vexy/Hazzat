<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazzat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Coptic&display=swap" rel="stylesheet">
    <script>
        // Runs before page appears, so it never flashes the wrong theme
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");        
    </script>
</head>

<body>
    <header>
        <h1 class="logo">
            <span class="logo-coptic">Ⲕⲩⲣⲓⲉ Ⲕⲁⲍⲁⲧ</span>
        </h1>
        <button id="themeToggle">Dark mode</button>
    </header>

    <main class="workspace">
        <section class="panel input-panel">
            <h2>Input</h2>
            <textarea id="hymnInput" placeholder="Type your hymn here..."></textarea>
            <div id="copticKeyboard" class="keyboard"></div>
        </section>

        <section class="panel output-panel">
            <h2>Hazzat</h2>
            <div id="hymnOutput"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
